apply plugin: 'com.android.library'

android {
    compileSdkVersion 33
    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 26
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    productFlavors {
    }
    namespace 'com.posbank.device.screader.kis'
}

dependencies {
    implementation files('libs/com.posbank.hardware.serial.jar')
    implementation files('libs/kisvan.jar')
}
